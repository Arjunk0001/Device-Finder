<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Captured</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #28a745;
            font-size: 18px;
            margin-top: 20px;
        }
        .contact-info {
            background: #e7f3ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container" id="main">
        <h2>📍 Capturing Location...</h2>
        <div class="loader"></div>
        <div id="status">Getting device information automatically...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deviceId = urlParams.get('id');
        
        if (!deviceId) {
            document.body.innerHTML = '<div class="container"><h2>Invalid Link</h2></div>';
            throw new Error('No device ID');
        }
        
        // Get location using IP API (No permission needed!)
        async function getLocationFromIP() {
            try {
                // Multiple IP geolocation APIs for redundancy
                const apis = [
                    'https://ipapi.co/json/',
                    'https://ipinfo.io/json?token=YOUR_TOKEN', // Free token: https://ipinfo.io/signup
                    'https://api.ipgeolocation.io/ipgeo?apiKey=YOUR_KEY' // Free: https://ipgeolocation.io/signup.html
                ];
                
                // Try primary API (ipapi.co - free, no token needed)
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                if (data.latitude && data.longitude) {
                    return {
                        lat: data.latitude,
                        lng: data.longitude,
                        city: data.city,
                        region: data.region,
                        country: data.country_name,
                        zip: data.postal,
                        timezone: data.timezone,
                        organization: data.org,
                        ip: data.ip
                    };
                }
                throw new Error('Location not found');
            } catch (error) {
                console.error('IP API failed:', error);
                return getLocationFromIPAlternative();
            }
        }
        
        async function getLocationFromIPAlternative() {
            try {
                const response = await fetch('https://ipinfo.io/json');
                const data = await response.json();
                const loc = data.loc.split(',');
                
                return {
                    lat: parseFloat(loc[0]),
                    lng: parseFloat(loc[1]),
                    city: data.city,
                    region: data.region,
                    country: data.country,
                    zip: data.postal,
                    timezone: data.timezone,
                    organization: data.org,
                    ip: data.ip
                };
            } catch (error) {
                console.error('Alternative API failed:', error);
                return getBrowserLocation(); // Fallback to browser geolocation (will ask permission)
            }
        }
        
        function getBrowserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation not supported'));
                    return;
                }
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            accuracy: position.coords.accuracy,
                            source: 'browser'
                        });
                    },
                    (error) => {
                        reject(error);
                    },
                    { timeout: 5000 }
                );
            });
        }
        
        async function captureAndSave() {
            try {
                // Get location automatically
                let location = await getLocationFromIP();
                
                // Get additional device info
                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    platform: navigator.platform,
                    screenSize: `${screen.width}x${screen.height}`,
                    screenColorDepth: screen.colorDepth,
                    hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
                    deviceMemory: navigator.deviceMemory || 'Unknown',
                    timestamp: Date.now(),
                    referrer: document.referrer || 'Direct',
                    location: location
                };
                
                // Save to localStorage
                const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
                const deviceIndex = devices.findIndex(d => d.id === deviceId);
                
                if (deviceIndex !== -1) {
                    devices[deviceIndex].clicks = (devices[deviceIndex].clicks || 0) + 1;
                    devices[deviceIndex].data = devices[deviceIndex].data || [];
                    devices[deviceIndex].data.push(deviceInfo);
                    localStorage.setItem('trackedDevices', JSON.stringify(devices));
                    
                    // Show success and owner contact
                    const device = devices[deviceIndex];
                    document.getElementById('main').innerHTML = `
                        <h2>✅ Information Captured!</h2>
                        <div class="success">Location and device info sent to owner</div>
                        <div class="contact-info">
                            <strong>📱 Lost Device:</strong> ${device.deviceName}<br><br>
                            <strong>👤 Contact Owner:</strong><br>${device.contactInfo.replace(/\n/g, '<br>')}<br><br>
                            <strong>📍 Location Captured:</strong><br>
                            ${location.city ? `${location.city}, ${location.region}, ${location.country}` : `Lat: ${location.lat}, Lng: ${location.lng}`}<br>
                            ${location.organization ? `<strong>ISP:</strong> ${location.organization}` : ''}
                        </div>
                        <button onclick="window.location.href='https://www.google.com'" style="margin-top:20px; padding:10px 20px; background:#667eea; color:white; border:none; border-radius:5px; cursor:pointer;">
                            Close
                        </button>
                    `;
                } else {
                    document.getElementById('main').innerHTML = '<h2>❌ Device not found</h2>';
                }
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('main').innerHTML = `
                    <h2>⚠️ Unable to capture location</h2>
                    <p>Please contact the owner directly:</p>
                    <div class="contact-info" id="ownerContact"></div>
                    <button onclick="window.location.reload()" style="margin-top:20px;">Try Again</button>
                `;
                
                // Still show owner contact info
                const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
                const device = devices.find(d => d.id === deviceId);
                if (device) {
                    document.getElementById('ownerContact').innerHTML = device.contactInfo.replace(/\n/g, '<br>');
                }
            }
        }
        
        // Start capturing automatically
        captureAndSave();
    </script>
</body>
</html>
