<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Phone Tracker - Generate Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .link-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .link-box.show {
            display: block;
        }
        .tracking-link {
            background: white;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            font-family: monospace;
            margin: 10px 0;
        }
        .device-item {
            background: #e9ecef;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Lost Phone Tracker</h2>
        <p>Generate link - No permission needed!</p>
        
        <input type="text" id="deviceName" placeholder="Device Name" required>
        <textarea id="contactInfo" rows="3" placeholder="Your WhatsApp/Phone" required></textarea>
        
        <button onclick="generateLink()">🚀 Generate Link</button>
        
        <div class="link-box" id="linkBox">
            <h3>Share this link:</h3>
            <div class="tracking-link" id="trackingLink"></div>
            <button onclick="copyLink()">📋 Copy Link</button>
            <button onclick="sendWhatsApp()">💬 Send WhatsApp</button>
        </div>

        <div style="margin-top: 30px;">
            <h3>📱 Your Devices</h3>
            <div id="savedDevices"></div>
        </div>
    </div>

    <script>
        function loadDevices() {
            const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
            const container = document.getElementById('savedDevices');
            if (devices.length === 0) {
                container.innerHTML = '<p style="color:#666;">No devices yet</p>';
                return;
            }
            container.innerHTML = devices.map(device => `
                <div class="device-item" onclick="window.location.href='dashboard.html?id=${device.id}'">
                    <strong>${device.deviceName}</strong><br>
                    <small>Clicks: ${device.clicks || 0} | ${new Date(device.createdAt).toLocaleString()}</small>
                </div>
            `).join('');
        }

        function generateLink() {
            const deviceName = document.getElementById('deviceName').value;
            const contactInfo = document.getElementById('contactInfo').value;
            
            if (!deviceName || !contactInfo) {
                alert('Please fill all fields');
                return;
            }
            
            const id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            const link = `${window.location.origin}${window.location.pathname.replace('index.html', '')}track.html?id=${id}`;
            
            const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
            devices.push({
                id: id,
                deviceName: deviceName,
                contactInfo: contactInfo,
                createdAt: Date.now(),
                clicks: 0,
                data: []
            });
            localStorage.setItem('trackedDevices', JSON.stringify(devices));
            
            document.getElementById('trackingLink').innerHTML = link;
            document.getElementById('linkBox').classList.add('show');
            loadDevices();
            
            document.getElementById('deviceName').value = '';
            document.getElementById('contactInfo').value = '';
        }
        
        function copyLink() {
            const linkText = document.getElementById('trackingLink').innerText;
            navigator.clipboard.writeText(linkText);
            alert('Link copied!');
        }
        
        function sendWhatsApp() {
            const link = document.getElementById('trackingLink').innerText;
            window.open(`https://wa.me/?text=🔴%20My%20phone%20is%20lost!%20Click%20this%20link%20to%20help:%20${encodeURIComponent(link)}`, '_blank');
        }
        
        loadDevices();
    </script>
</body>
</html>
