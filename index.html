<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Phone Tracker - Generate Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 { color: #333; margin-bottom: 10px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .link-box {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .tracking-link {
            background: white;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            font-family: monospace;
            margin: 10px 0;
        }
        .device-item {
            background: #e9ecef;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .device-item:hover { background: #dee2e6; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Lost Phone Tracker</h2>
        <p style="color:#666; margin-bottom:20px;">Generate tracking link for your lost device</p>
        
        <input type="text" id="deviceName" placeholder="Device Name (e.g., iPhone 13)" required>
        <textarea id="contactInfo" rows="3" placeholder="Your WhatsApp Number (with country code)" required></textarea>
        <input type="text" id="reward" placeholder="Reward Amount (e.g., ₹2000)">
        
        <button onclick="generateLink()">🚀 Generate Tracking Link</button>
        
        <div class="link-box" id="linkBox">
            <h3>📎 Share this link:</h3>
            <div class="tracking-link" id="trackingLink"></div>
            <button onclick="copyLink()">📋 Copy Link</button>
            <button onclick="sendWhatsApp()">💬 Send via WhatsApp</button>
            <p style="font-size:12px; color:#666; margin-top:10px;">
                ⚠️ When someone clicks this link, they'll be asked for location once
            </p>
        </div>

        <div style="margin-top: 30px;">
            <h3>📱 Your Tracked Devices</h3>
            <div id="savedDevices"></div>
        </div>
    </div>

    <script>
        function loadDevices() {
            const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
            const container = document.getElementById('savedDevices');
            if (devices.length === 0) {
                container.innerHTML = '<p style="color:#666;">No devices tracked yet</p>';
                return;
            }
            container.innerHTML = devices.map(device => `
                <div class="device-item" onclick="window.location.href='dashboard.html?id=${device.id}'">
                    <strong>${device.deviceName}</strong><br>
                    <small>Clicks: ${device.clicks || 0} | Last: ${device.lastCapture ? new Date(device.lastCapture).toLocaleString() : 'Never'}</small>
                </div>
            `).join('');
        }

        function generateLink() {
            const deviceName = document.getElementById('deviceName').value;
            const contactInfo = document.getElementById('contactInfo').value;
            const reward = document.getElementById('reward').value;
            
            if (!deviceName || !contactInfo) {
                alert('Please fill device name and contact info');
                return;
            }
            
            const id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
            const link = `${baseUrl}track.html?id=${id}`;
            
            const devices = JSON.parse(localStorage.getItem('trackedDevices') || '[]');
            devices.push({
                id: id,
                deviceName: deviceName,
                contactInfo: contactInfo,
                reward: reward,
                createdAt: Date.now(),
                clicks: 0,
                lastCapture: null,
                data: []
            });
            localStorage.setItem('trackedDevices', JSON.stringify(devices));
            
            document.getElementById('trackingLink').innerHTML = link;
            document.getElementById('linkBox').style.display = 'block';
            loadDevices();
            
            document.getElementById('deviceName').value = '';
            document.getElementById('contactInfo').value = '';
            document.getElementById('reward').value = '';
        }
        
        function copyLink() {
            const linkText = document.getElementById('trackingLink').innerText;
            navigator.clipboard.writeText(linkText);
            alert('Link copied!');
        }
        
        function sendWhatsApp() {
            const link = document.getElementById('trackingLink').innerText;
            const text = `🔴 HELP: My phone is lost! If you find this device, please click this link to help return it. Reward offered. ${link}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }
        
        loadDevices();
        setInterval(loadDevices, 2000);
    </script>
</body>
</html>
